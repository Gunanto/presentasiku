<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presentasiku — Gunanto</title>
<style>
  :root{--navy:#0a1730;--red:#e63946;--gold:#ffc94d;--ink:#f5f8ff;--muted:#aeb9d8}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:radial-gradient(1200px 700px at 85% 0%,#16295e 0%,#0a1730 55%,#070f24 100%);
    color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
    min-height:100vh;padding:6vmin 7vmin}
  header{max-width:1100px;margin:0 auto 5vmin}
  .kicker{display:inline-block;font-size:1.6vmin;letter-spacing:.28em;text-transform:uppercase;
    color:var(--gold);border:1px solid rgba(255,201,77,.55);border-radius:999px;
    padding:1vmin 2.4vmin;margin-bottom:2vmin}
  h1{font-size:5.4vmin;font-weight:800} h1 span{color:var(--gold)}
  .sub{color:var(--muted);font-size:2.4vmin;margin-top:1.4vmin;max-width:70ch;line-height:1.6}
  .grid{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:3vmin}
  .card{background:linear-gradient(160deg,rgba(30,52,110,.85),rgba(16,32,74,.9));
    border:1px solid rgba(140,170,255,.22);border-radius:2.4vmin;overflow:hidden;
    box-shadow:0 1.5vmin 4vmin rgba(0,0,0,.35);display:flex;flex-direction:column;
    transition:transform .2s}
  .card:hover{transform:translateY(-.6vmin)}
  .card img.thumb{width:100%;height:200px;object-fit:cover;object-position:top}
  .card .body{padding:2.6vmin;display:flex;flex-direction:column;gap:1.2vmin;flex:1}
  .date{font-size:1.9vmin;color:var(--gold);letter-spacing:.14em;text-transform:uppercase}
  .card h2{font-size:2.7vmin;line-height:1.3}
  .card p{font-size:2.1vmin;color:var(--muted);line-height:1.55}
  .btn{margin-top:auto;align-self:flex-start;background:var(--gold);color:#0a1730;font-weight:700;
    font-size:2.1vmin;padding:1.4vmin 3vmin;border-radius:999px;text-decoration:none}
  .btn:hover{background:#ffd77a}
  footer{max-width:1100px;margin:6vmin auto 0;color:var(--muted);font-size:2vmin;
    border-top:1px solid rgba(140,170,255,.18);padding-top:2.4vmin}
</style>
</head>
<body>
<header>
  <span class="kicker">Arsip Narasumber</span>
  <h1>Presentasi<span>ku</span></h1>
  <p class="sub">Kumpulan slide presentasi <b>Gunanto</b> (Guru Matematika — SMPN 1 Punggur) dalam berbagai kegiatan sebagai narasumber / pemateri. Klik kartu untuk membuka slide.</p>
</header>
<main id="cards" class="grid"></main>
<footer>Gunanto • SMPN 1 Punggur • Diperbarui Oktober 2026 · <a href="/admin.html">Admin</a></footer>
<script>
(function(){
  var fallbackCards = [
    {date:"13 Oktober 2026",title:"AI dan Literasi Digital dalam Pendidikan",description:"PGRI Kabupaten Lampung Tengah • Hotel BBC Bandarjaya — Praktik pemanfaatan AI untuk menunjang tugas pokok guru.",target:"/2026-10-13-pgri-ai-digital/",thumbnail:"/2026-10-13-pgri-ai-digital/assets/ilustrasi-cover.jpg"},
    {date:"2026",title:"FKK Daring 1 — Inkuiri Kolaboratif & Growth Mindset",description:"Pelatihan Pembelajaran Mendalam bagi Guru • Daring — Penguatan inkuiri kolaboratif dan pola pikir bertumbuh (2 × 45 menit).",target:"/fkk-daring-1-penguatan/",thumbnail:"/fkk-daring-1-penguatan/assets/fkkd-cover.jpg"},
    {date:"6 Oktober 2026",title:"FKK Daring Siklus 3 — Pembelajaran Mendalam Berbasis Kelompok Kerja",description:"MGMP Matematika SMP Lampung Tengah • Jadwal tahapan implementasi, 7 poin pemanfaatan PID, dan 10 poin perencanaan & asesmen — 20 slide.",target:"/2026-10-6-fkk-daring-3/",thumbnail:"/2026-10-6-fkk-daring-3/assets/ringkasan-cover.jpg"},
    {date:"6 Oktober 2026",title:"Pengantar FKK Daring Siklus 3 — Pendampingan Kelompok Kerja",description:"MGMP Matematika SMP Lampung Tengah • Alur sesi pendampingan: pembukaan, refleksi & berbagi via Padlet, rencana perbaikan — 11 slide.",target:"/2026-10-6-fkk-daring-3-pengantar/",thumbnail:"/2026-10-6-fkk-daring-3-pengantar/assets/pengantar-cover.jpg"},
    {date:"17 Oktober 2026",title:"Pemanfaatan AI untuk Pembelajaran Matematika SMP",description:"Webinar FKN (Forum Komunikasi MGMP Matematika SMP) • Google Meet — Pembelajaran yang lebih kreatif, inovatif, dan bermakna.",target:"/2026-10-20-fkn-muse-asisten-ai/",thumbnail:"/2026-10-20-fkn-muse-asisten-ai/assets/fkn-cover.jpg"}
  ];

  function addText(parent, tag, className, text){
    var element=document.createElement(tag);
    if(className) element.className=className;
    element.textContent=text || "";
    parent.appendChild(element);
    return element;
  }

  function render(cards){
    var container=document.getElementById("cards");
    container.replaceChildren();
    cards.filter(function(card){return card && card.active !== false;}).forEach(function(card){
      var article=document.createElement("article");article.className="card";
      var image=document.createElement("img");image.className="thumb";image.src=card.thumbnail;image.alt=card.title || "Slide";article.appendChild(image);
      var body=document.createElement("div");body.className="body";
      addText(body,"div","date",card.date);
      addText(body,"h2","",card.title);
      addText(body,"p","",card.description);
      var link=document.createElement("a");link.className="btn";link.href=card.target;link.textContent="Buka Slide →";body.appendChild(link);
      article.appendChild(body);container.appendChild(article);
    });
  }

  render(fallbackCards);
  fetch("/_slide_config",{cache:"no-store"}).then(function(response){
    if(!response.ok) throw new Error("Config unavailable");
    return response.json();
  }).then(function(data){
    if(Array.isArray(data.cards)) render(data.cards);
  }).catch(function(){ /* Gunakan card bawaan jika service belum tersedia. */ });
})();
</script>
</body>
</html>
