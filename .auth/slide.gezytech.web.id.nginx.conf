server {
    server_name slide.gezytech.web.id;

    root /home/ubuntu/slide;
    index index.html;

    location = /_slide_auth {
        internal;
        proxy_pass http://127.0.0.1:3107/_slide_auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /_slide_login {
        proxy_pass http://127.0.0.1:3107/_slide_login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /_slide_logout {
        proxy_pass http://127.0.0.1:3107/_slide_logout;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Landing page dan halaman input token harus tetap bisa dibuka tanpa sesi.
    location = / { try_files /index.html =404; }
    location = /index.html { try_files $uri =404; }
    location = /slide-login.html { try_files $uri =404; }
    location = /admin.html { try_files $uri =404; }

    location = /_slide_config {
        proxy_pass http://127.0.0.1:3107/_slide_config;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /_slide_admin_login {
        proxy_pass http://127.0.0.1:3107/_slide_admin_login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /_slide_admin_logout {
        proxy_pass http://127.0.0.1:3107/_slide_admin_logout;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /_slide_admin_config {
        proxy_pass http://127.0.0.1:3107/_slide_admin_config;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Thumbnail kartu landing tetap publik. Isi direktori slide tetap dilindungi.
    location = /2026-10-13-pgri-ai-digital/assets/ilustrasi-cover.jpg { try_files $uri =404; }
    location = /2026-10-20-fkn-muse-asisten-ai/assets/fkn-cover.jpg { try_files $uri =404; }
    location = /2026-10-6-fkk-daring-3/assets/ringkasan-cover.jpg { try_files $uri =404; }
    location = /2026-10-6-fkk-daring-3-pengantar/assets/pengantar-cover.jpg { try_files $uri =404; }
    location = /fkk-daring-1-penguatan/assets/fkkd-cover.jpg { try_files $uri =404; }

    # Every other path, including new slide folders, requires a valid token.
    location / {
        auth_request /_slide_auth;
        error_page 401 = @slide_access_denied;
        try_files $uri $uri/ =404;
    }

    location @slide_access_denied {
        return 302 /slide-login.html?next=$uri;
    }

    location ~ /\. {
        deny all;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/slide.gezytech.web.id/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/slide.gezytech.web.id/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = slide.gezytech.web.id) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name slide.gezytech.web.id;
    return 404; # managed by Certbot
}
