<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token akses — Presentasiku</title>
<style>
  :root{color-scheme:dark;--navy:#0a1730;--navy2:#18356f;--gold:#ffc94d;--ink:#f5f8ff;--muted:#aeb9d8}
  *{box-sizing:border-box}
  body{min-height:100vh;margin:0;padding:1.5rem;display:grid;place-items:center;
    background:radial-gradient(1200px 700px at 85% 0%,#16295e 0%,var(--navy) 55%,#070f24 100%);
    color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,sans-serif}
  main{width:min(100%,28rem);padding:clamp(1.5rem,5vw,2.5rem);border:1px solid rgba(140,170,255,.4);
    border-radius:1.5rem;background:linear-gradient(145deg,var(--navy2),#0b1938);box-shadow:0 1.5rem 5rem rgba(0,0,0,.6)}
  h1{margin:0;font-size:clamp(1.45rem,6vw,2rem);line-height:1.2}
  p{margin:.8rem 0 0;color:var(--muted)}
  label{display:block;margin-top:1.5rem;color:var(--gold);font-size:.9rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
  input{width:100%;margin-top:.6rem;padding:.9rem 1rem;border:1px solid rgba(140,170,255,.5);border-radius:.75rem;
    background:#08142e;color:var(--ink);font:700 1.2rem/1.2 "Segoe UI",system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase}
  input:focus{outline:.18rem solid var(--gold);outline-offset:.14rem}
  button{width:100%;margin-top:1.2rem;border:0;border-radius:999px;padding:.85rem 1.2rem;background:var(--gold);
    color:#0a1730;font:700 1rem/1 "Segoe UI",system-ui,sans-serif;cursor:pointer}
  button:hover{background:#ffd77a}
  #error{min-height:1.4rem;margin-top:.7rem;color:#ffb3ba;font-size:.9rem}
  a{display:block;margin-top:1rem;color:var(--muted);text-align:center}
</style>
</head>
<body>
<main>
  <h1>Masukkan token akses</h1>
  <p>Token diperlukan sebelum slide dapat dibuka.</p>
  <form id="form">
    <label for="token">Token</label>
    <input id="token" name="token" type="text" inputmode="text" autocomplete="off" autocapitalize="characters"
      spellcheck="false" minlength="5" maxlength="10" required placeholder="CONTOH26" aria-describedby="error">
    <p id="error" role="alert" aria-live="polite"></p>
    <button type="submit">Buka Slide</button>
  </form>
  <a href="/">Kembali ke daftar slide</a>
</main>
<script>
(function(){
  var params=new URLSearchParams(location.search);
  var target=params.get("next")||"/";
  if(!target.startsWith("/")||target.startsWith("//")) target="/";
  var form=document.getElementById("form"), input=document.getElementById("token"), error=document.getElementById("error");
  input.addEventListener("input",function(){input.value=input.value.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,10)});
  form.addEventListener("submit",function(event){
    event.preventDefault();
    var token=input.value;
    if(!/^[A-Z0-9]{5,10}$/.test(token)){
      error.textContent="Token harus terdiri dari 5–10 huruf kapital atau angka.";
      input.focus();
      return;
    }
    fetch("/_slide_login",{
      method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",
      body:JSON.stringify({token:token,target:target})
    }).then(function(response){
      if(response.ok){location.href=target;return null}
      return response.json().catch(function(){return {error:"Token tidak dapat diverifikasi."}})
    }).then(function(result){if(result){error.textContent=result.error;input.select()}})
      .catch(function(){error.textContent="Koneksi ke layanan token gagal. Coba lagi."});
  });
  input.focus();
})();
</script>
</body>
</html>
